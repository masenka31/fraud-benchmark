paths:
  raw: data/raw
  processed: data/processed

split:
  ratios: [0.8, 0.1, 0.1]

# A campaign is a run of frauds on one entity, each within `gap` of the last.
# Entity alone is not enough: IBM CCF cards carry frauds decades apart, and
# Amaretto's anomalies would collapse into 27 episodes at a 7-day gap.
# 1 day is where Sparkov saturates (1,005 episodes, unchanged at 7d and 30d)
# while keeping every other card dataset's tail plausible.
campaign:
  gap: 1D

# Reporting delay, lognormal in days. median_days is the distribution's median;
# sigma controls the tail. Seeded so runs are reproducible.
#
# The default is a card-fraud regime: a cardholder notices on a statement or an
# alert and disputes inside the 60-120 day chargeback window, so a 1-2 week
# median with a long right tail (p95 36d) is the right shape. It applies to
# banksim, sparkov, ieee_cis and ibm_ccf. AML moves far slower and is overridden
# per dataset below. None of the seven sources ships a real reporting timestamp,
# so every delay here is synthetic by construction; see docs/verification-notes.md.
delay:
  median_days: 7.0
  sigma: 1.0
  seed: 0
  max_delay_days: null

datasets:
  # PaySim's `step` column is an hour offset, not a real date, so it is
  # anchored to this start date.
  paysim:
    start_date: "2023-01-01"
    # Its whole span is 30 simulated days, so the train window is 14. At the
    # global 7-day median only 47.3% of train frauds are reported by the train
    # cutoff. This keeps the dataset usable; it does not make a 30-day clock
    # realistic. sigma and seed inherit.
    delay:
      median_days: 1.0
  # BankSim's `step` column is a 0-based day offset (0-179), not a real date.
  banksim:
    start_date: "2023-01-01"
  # Sparkov keeps its upstream test file as the test split; validation is the
  # last val_fraction of the upstream train file.
  sparkov:
    val_fraction: 0.1
  # Row-identical to sparkov, differing only in reported_at. At the card-fraud
  # default Sparkov's 487-day train window censors only 2.1% of train labels, so
  # the delay barely registers; this regime raises it to ~8.5%. The median stays
  # plausible for a cardholder noticing on a statement; the tail is deliberately
  # longer than a realistic chargeback window, which is what does the censoring.
  # sigma = sqrt(2*ln(60/15)): median 15 days, nominal mean 60. Capped at a year,
  # since a dispute is not filed after that.
  sparkov_slow:
    val_fraction: 0.1
    delay:
      median_days: 15.0
      sigma: 1.665
      max_delay_days: 365
  # A user may hold several cards; 'user' groups them, 'card' keeps them separate.
  ibm_ccf:
    entity_key: user
  # TransactionDT is a seconds offset with no stated origin.
  ieee_cis:
    start_date: "2017-12-01"
  # AML, not card fraud: an alert opens an investigation and the SAR clock only
  # starts at detection, which itself lags the transaction by weeks. A 30-day
  # median is the realistic regime; the 320-day span absorbs it, censoring 19.2%
  # of train frauds against 5.7% at the card-fraud default. sigma and seed inherit.
  saml_d:
    delay:
      median_days: 30.0
  amaretto:
    # Also AML, but its whole span is 83 days and the train window 65, so a
    # realistic 30-day median censors 53.4% of train frauds and a 15-day one
    # 33.6% -- degenerate either way. It therefore keeps the 7-day card-fraud
    # default, which is deliberately too fast for AML and is the only setting
    # the span will carry. Handled as PaySim's short clock was: documented,
    # not repaired. Anomalies here are far burstier than card fraud: 0.7-minute median
    # inter-arrival, 97.7% of consecutive pairs within an hour. At the 1-day
    # default this yields 490 episodes with a 3,870-row maximum; at 1 hour,
    # 1,852 episodes with a median of 8.
    campaign_gap: 1h
