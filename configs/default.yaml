paths:
  raw: data/raw
  processed: data/processed

split:
  ratios: [0.8, 0.1, 0.1]

# A campaign is a run of frauds on one entity, each within `gap` of the last.
# Entity alone is not enough: IBM CCF cards carry frauds decades apart, and
# Amaretto's anomalies would collapse into 27 episodes at a 7-day gap.
# 1 day is where Sparkov saturates (1,005 episodes, unchanged at 7d and 30d)
# while keeping every other card dataset's tail plausible.
campaign:
  gap: 1D

# Reporting delay, lognormal in days. median_days is the distribution's median;
# sigma controls the tail. Seeded so runs are reproducible.
delay:
  median_days: 7.0
  sigma: 1.0
  seed: 0
  max_delay_days: null

datasets:
  # PaySim's `step` column is an hour offset, not a real date, so it is
  # anchored to this start date.
  paysim:
    start_date: "2023-01-01"
    # Its whole span is 30 simulated days, so the train window is 14. At the
    # global 7-day median only 47.3% of train frauds are reported by the train
    # cutoff. This keeps the dataset usable; it does not make a 30-day clock
    # realistic. sigma and seed inherit.
    delay:
      median_days: 1.0
  # BankSim's `step` column is a 0-based day offset (0-179), not a real date.
  banksim:
    start_date: "2023-01-01"
  # Sparkov keeps its upstream test file as the test split; validation is the
  # last val_fraction of the upstream train file.
  sparkov:
    val_fraction: 0.1
  # A user may hold several cards; 'user' groups them, 'card' keeps them separate.
  ibm_ccf:
    entity_key: user
  # Two crops of ibm_ccf to [2016-01-01, last labelled fraud 2019-10-27]:
  # 6,569,157 rows, 8,412 frauds, 982 of them in test. Row-identical to each
  # other; they differ only in reporting delay, so a model can be compared
  # across delay regimes on the same data.
  #
  # Why crop at all: ibm_ccf spans 10,649 days, so a realistic delay censors
  # 3 of its 24,924 train frauds — no delay effect to measure. Why 2016-01-01
  # rather than a three-year window: the latter starts in late October 2016 and
  # discards most of a heavy fraud year. +27% rows buys +58% frauds.
  ibm_ccf_subsample_fast:
    entity_key: user
    start_date: "2016-01-01"
    delay:
      # sigma = sqrt(2*ln(30/7)): median 7 days, mean 30. Capped at a year —
      # untruncated this samples delays out to 1,813 days, well past the end of
      # the data. The cap bites ~1% of campaigns and pulls the realised mean to
      # about 25 days.
      sigma: 1.706
      max_delay_days: 365
  ibm_ccf_subsample_slow:
    entity_key: user
    start_date: "2016-01-01"
    delay:
      # sigma = sqrt(2*ln(60/15)): median 15 days, mean 60. Roughly doubles the
      # censoring of the fast variant. Realised mean about 51 days after the cap.
      median_days: 15.0
      sigma: 1.665
      max_delay_days: 730
  # TransactionDT is a seconds offset with no stated origin.
  ieee_cis:
    start_date: "2017-12-01"
  amaretto:
    # Anomalies here are far burstier than card fraud: 0.7-minute median
    # inter-arrival, 97.7% of consecutive pairs within an hour. At the 1-day
    # default this yields 490 episodes with a 3,870-row maximum; at 1 hour,
    # 1,852 episodes with a median of 8.
    campaign_gap: 1h
