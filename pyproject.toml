[build-system]
# 77+ for PEP 639 SPDX `license` / `license-files` support.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-benchmark"
version = "0.1.0"
description = "Download, normalize, split, and label-delay public fraud and AML datasets"
requires-python = ">=3.11"
# Covers this repository's code only. Each dataset carries its own terms;
# see docs/dataset-licenses.md.
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "kagglehub>=1.0.2",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
]

[project.optional-dependencies]
# None of these is used by the pipeline. They back the model side of
# src/fraud_benchmark/experiments/ and the figure scripts; 1.4 is the floor for
# passing string column names to
# HistGradientBoostingClassifier(categorical_features=...). torch is CPU-only here
# -- the cluster nodes have no GPU -- and is needed by experiments/mlp.py.
dev = [
    "pytest>=8",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "torch>=2.0",
]

[project.scripts]
fraud-benchmark = "fraud_benchmark.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet access and Kaggle credentials"]
addopts = "-m 'not network'"

[tool.ruff]
exclude = [
    ".git",
    ".hypothesis",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "node_modules",
]
# 100, not the formatter's default 88: the code was already written to this width,
# and the dataset/column names in this repo are long. target-version is inferred
# from requires-python (3.11) -- do not pin it higher, or ruff will rewrite code
# into syntax the floor cannot run.
line-length = 100

[tool.ruff.lint]
preview = true
ignore = [
    "A001", # Variable {name} is shadowing a python builtin
    "A002", # Argument {name} is shadowing a python builtin
    "A003", # Attribute {name} is shadowing a python builtin
    "B009", # Do not call `getattr` with a constant attribute value. It is not any safer than normal property access. -> MyPy complains on private members.
    "B010", # Do not call `setattr` with a constant attribute value. It is not any safer than normal property access.
    "B905", # `zip()` without an explicit `strict=` parameter
    "BLE001", # Do not catch blind exception: `Exception`
    "C408", # dict() call
    "C420", # dict.fromkeys
    "COM812", # Missing trailing comma -- conflicts with the formatter, which owns this.
    "E266", # Too many leading `#` before block comment
    "N818", # Exception name {name} should be named with an Error suffix
    "PT001", # Use @pytest.fixture() over @pytest.fixture
    "S105", # Potential usage of hardcoded passwords in strings
    "S106", # Potential usege of hardcoded secrets in strings
    "S301", # `pickle` and modules that wrap it can be unsafe when used to deserialize untrusted data, possible security issue
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
    "S403", # `pickle`, `cPickle`, `dill`, and `shelve` modules are possibly insecure
    "S404", # Suspicious subprocess import
    "S603", # `subprocess` call: check for execution of untrusted input
    "S607", # starting of a (sub)process with a partial executable path
    "SIM102", # Use a single `if` statement instead of nested `if` statements
    "SIM108", # Use a ternary operator instead of if-else block
    "SIM117", # Use a single `with` statement with multiple contexts instead of nested `with` statements
    "SIM118", # Do not use "k in actual.keys()"

    "UP007", # Use `X | Y` for type annotations (triggers on Optional[])
    "UP015", # Unnecessary open mode parameters
    "ERA001", # Commented-out code

    # Remove when fixed
    "C901", # Complex structures
    "PTH118", # `os.path.join()` should be replaced by `Path` with `/` operator
    "UP040", # Needs support for new mypy
    "UP045", # Allow Optional[]
    "UP046", # Allow Generic[]
    "UP017", # Migrate everything to DateTime
    "UP047", # Generic function should use type parameters
]
select = [
    'A', # flake8-builtins
    # 'ASYNC', # flake8-async
    'B', # flake8-bugbear
    'BLE', # flake8-blind-except
    'C4', # flake8-comprehensions
    'C90', # mccabe
    'COM', # flake8-commas
    'DTZ', # flake8-datetimez
    'E', # pycodestyle / Error
    # 'EM', # flake8-errmsg
    'ERA', # eradicate
    'F', # Pyflakes
    # 'FBT', # flake8-boolean-trap
    # 'G', # flake8-logging-format
    'I', # isort
    'N', # pep8-naming
    'NPY', # NumPy-specific rules
    'PIE', # flake8-pie
    'PT', # flake8-pytest-style
    'PTH', # flake8-use-pathlib
    'S', # flake8-bandit
    'SIM', # flake8-simplify
    'TID', # flake8-tidy-imports
    'UP', # pyupgrade
    'W', # pycodestyle / Warning
]

[tool.ruff.lint.per-file-ignores]
'**/tests/**' = ['S101']  # assert is expected in test files

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.isort]
# The src/ layout lets ruff detect fraud_benchmark as first-party on its own, so
# there is no known-first-party list to keep in sync.
# One import per line: a new symbol is a one-line diff, never a reflowed block.
force-single-line = true

[tool.ruff.format]
# Double, not single: the code is ~5000 double quotes to ~340 single.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
