[build-system]
# 77+ for PEP 639 SPDX `license` / `license-files` support.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-benchmark"
version = "0.1.0"
description = "Download, normalize, split, and label-delay public fraud and AML datasets"
requires-python = ">=3.11"
# Covers this repository's code only. Each dataset carries its own terms;
# see docs/dataset-licenses.md.
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "kagglehub>=1.0.2",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
]

[project.optional-dependencies]
# None of these is used by the pipeline. They back the leakage ablation study in
# src/fraud_benchmark/ablation/ and the experiments in scripts/; 1.4 is the floor
# for passing string column names to
# HistGradientBoostingClassifier(categorical_features=...). torch is CPU-only
# here -- the cluster nodes have no GPU -- and is needed by scripts/seq_mlp*.py.
dev = [
    "pytest>=8",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "torch>=2.0",
]

[project.scripts]
fraud-benchmark = "fraud_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet access and Kaggle credentials"]
addopts = "-m 'not network'"
